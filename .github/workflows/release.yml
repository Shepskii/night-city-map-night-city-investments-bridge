name: Release Module

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: node --test

      - name: Package
        run: |
          zip -r night-city-map-night-city-investments-bridge.zip module.json LICENSE README.md scripts lang

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            night-city-map-night-city-investments-bridge.zip
